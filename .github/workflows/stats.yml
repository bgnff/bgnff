name: Atualizar estatísticas

on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: atualizar-estatisticas
  cancel-in-progress: false

jobs:
  gerar:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar repositório
        uses: actions/checkout@v6

      - name: Gerar cartão de estatísticas
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: stats
          options: username=bgnff&show_icons=true&locale=pt-br&border_color=E8A87C&border_radius=10&bg_color=0D1117&title_color=FFFFFF&text_color=9CA3AF&icon_color=E8A87C
          path: profile/stats.svg
          token: ${{ secrets.GITHUB_TOKEN }}
          fail_on_error: true

      - name: Gerar cartão de linguagens
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: top-langs
          options: username=bgnff&layout=compact&langs_count=6&locale=pt-br&border_color=E8A87C&border_radius=10&bg_color=0D1117&title_color=FFFFFF&text_color=9CA3AF
          path: profile/top-langs.svg
          token: ${{ secrets.GITHUB_TOKEN }}
          fail_on_error: true

      - name: Salvar cartões
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add profile/stats.svg profile/top-langs.svg

          if git diff --cached --quiet; then
            echo "Nenhuma alteração nos cartões."
          else
            git commit -m "Atualiza cartões de estatísticas"
            git push
          fi
